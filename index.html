<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Công Việc" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231d1d1f'/><path d='M30 52 L44 66 L72 36' stroke='%2334c759' stroke-width='10' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>" />
    <link rel="manifest" href="/manifest.json" />
    <title>Quản Lý Công Việc Cá Nhân</title>
    <meta name="description" content="Ứng dụng quản lý dự án và công việc cá nhân tối giản, trực quan, hỗ trợ checklist, tiến độ tự động, sub-task và lưu trữ offline." />
    <meta property="og:title" content="Quản Lý Công Việc Cá Nhân" />
    <meta property="og:description" content="Ứng dụng quản lý dự án và công việc cá nhân tối giản, trực quan, hỗ trợ checklist, tiến độ tự động, sub-task và lưu trữ offline." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('task_manager_theme_mode') || 'system';
          var isDark = mode === 'dark' || (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#0b0f17');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
