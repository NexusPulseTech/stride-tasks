[package]
name = "app"
version = "3.0.0"
description = "Stride Tasks — personal task manager with Kanban, Pomodoro and SM-2 spaced repetition"
authors = ["NexusPulse Studio"]
license = "MIT"
repository = "https://github.com/NexusPulseTech/stride-tasks"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = [] }
tauri-plugin-log = "2"
