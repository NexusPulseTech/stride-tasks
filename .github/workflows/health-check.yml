name: Production health check

# Kiểm tra sống mỗi 6 giờ và ngay sau mỗi lần deploy thành công, không tạo đơn hay dữ liệu trên máy chủ. Job check (curl): app,
# header bảo mật ở edge, trang đích, trang pháp lý và Worker (định dạng claim, webhook fail-closed, CORS). Job offline (Chrome):
# chế độ ngoại tuyến thật (B11). Bước nào lỗi thì GitHub gửi email cho người sửa workflow gần nhất.
# Lưu ý: GitHub tự tắt lịch này sau 60 ngày repo không có commit; bật lại ở tab Actions.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  # B11: chạy ngay sau mỗi lần deploy, vì khung lỗi service worker nằm ngay sau deploy (sw.js cũ ở cache biên Cloudflare)
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]

# Mặc định không cấp quyền nào của GITHUB_TOKEN (B10): job check chỉ gọi curl tới production.
# Job offline cần đọc repo để lấy scripts/offline-check.mjs nên tự khai contents: read ở cấp job.
permissions: {}

env:
  APP: https://tasks.nexuspulsetech.xyz
  API: https://tasks-api.nexuspulsetech.xyz

jobs:
  # B11: app thật sự chạy ngoại tuyến. Chrome có sẵn trên runner; pha 1 có mạng chờ service worker activated,
  # pha 2 cắt mạng thật (proxy chết) rồi gõ một việc và mở hộp Daily Focus. Chặn Cloudflare analytics, không tạo dữ liệu trên máy chủ.
  offline:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: App installs its service worker and works with the network off
        run: node scripts/offline-check.mjs "$APP/"

  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: App shell has the CSP meta tag and the frame guard
        run: |
          set -euo pipefail
          body=$(curl -fsS --max-time 20 "$APP/?hc=$(date +%s)")
          grep -q 'http-equiv="Content-Security-Policy"' <<<"$body"
          grep -q 'window.top!==window.self' <<<"$body"

      - name: Edge security headers are present
        run: |
          set -euo pipefail
          headers=$(curl -fsSI --max-time 20 "$APP/")
          for expected in "x-frame-options: DENY" "frame-ancestors 'none'" "x-content-type-options: nosniff" "strict-transport-security:"; do
            grep -qi "$expected" <<<"$headers" || { echo "missing header: $expected"; exit 1; }
          done

      - name: Landing, legal pages, sitemap and service worker respond
        run: |
          set -euo pipefail
          for path in /en/ /vi/ /privacy.html /terms.html /refund.html /sitemap.xml /manifest.json /sw.js; do
            curl -fsS --max-time 20 -o /dev/null "$APP$path" || { echo "failed: $path"; exit 1; }
          done
          # Đọc hết trang rồi mới grep: ống curl | grep -q làm curl lỗi 23 khi grep thoát sớm (báo động giả 2026-11-16, 2026-11-17)
          landing=$(curl -fsS --max-time 20 "$APP/en/")
          grep -q 'upgrade=pro' <<<"$landing"

      - name: Worker routes, validation and CORS answer as expected
        run: |
          set -euo pipefail
          status() { curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$@"; }
          test "$(status "$API/claim?order=BAD")" = "400"
          test "$(status -X POST -H 'Content-Type: application/json' -d '{}' "$API/webhooks/polar")" = "403"
          test "$(status -X OPTIONS -H 'Origin: https://tasks.nexuspulsetech.xyz' -H 'Access-Control-Request-Method: POST' "$API/v1/orders")" = "204"
          test "$(status "$API/nope")" = "404"
          test "$(status "$API/v1/pricing")" = "200"
