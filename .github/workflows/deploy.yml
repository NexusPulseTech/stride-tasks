name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Mặc định không cấp quyền nào; mỗi job tự khai báo quyền tối thiểu (B10).
# Action ghim theo SHA commit đầy đủ, chú thích là tag tương ứng; Dependabot nâng cả hai.
permissions: {}

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build
        # Cấu hình thương mại công khai (Settings → Secrets and variables → Actions → Variables).
        # Chưa khai báo → paywall tắt, mọi tính năng mở miễn phí.
        env:
          VITE_ENABLE_PAYWALL: ${{ vars.VITE_ENABLE_PAYWALL }}
          VITE_VIETQR_IMAGE_URL: ${{ vars.VITE_VIETQR_IMAGE_URL }}
          VITE_LEMONSQUEEZY_CHECKOUT_URL: ${{ vars.VITE_LEMONSQUEEZY_CHECKOUT_URL }}
          VITE_LEMONSQUEEZY_CHECKOUT_URL_EMERGING: ${{ vars.VITE_LEMONSQUEEZY_CHECKOUT_URL_EMERGING }}
          VITE_POLAR_CHECKOUT_URL: ${{ vars.VITE_POLAR_CHECKOUT_URL }}
          VITE_POLAR_CHECKOUT_URL_EMERGING: ${{ vars.VITE_POLAR_CHECKOUT_URL_EMERGING }}
          VITE_LICENSE_CLAIM_URL: ${{ vars.VITE_LICENSE_CLAIM_URL }}
          VITE_SYNC_API_URL: ${{ vars.VITE_SYNC_API_URL }}
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
