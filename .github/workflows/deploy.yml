name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Type check
        run: npm run lint

      - name: Build production bundle
        run: npm run build
        # Cấu hình thương mại công khai (Settings → Secrets and variables → Actions → Variables).
        # Chưa khai báo → paywall tắt, mọi tính năng mở miễn phí.
        env:
          VITE_ENABLE_PAYWALL: ${{ vars.VITE_ENABLE_PAYWALL }}
          VITE_VIETQR_IMAGE_URL: ${{ vars.VITE_VIETQR_IMAGE_URL }}
          VITE_LEMONSQUEEZY_CHECKOUT_URL: ${{ vars.VITE_LEMONSQUEEZY_CHECKOUT_URL }}
          VITE_LEMONSQUEEZY_CHECKOUT_URL_EMERGING: ${{ vars.VITE_LEMONSQUEEZY_CHECKOUT_URL_EMERGING }}
          VITE_POLAR_CHECKOUT_URL: ${{ vars.VITE_POLAR_CHECKOUT_URL }}
          VITE_POLAR_CHECKOUT_URL_EMERGING: ${{ vars.VITE_POLAR_CHECKOUT_URL_EMERGING }}
          VITE_LICENSE_CLAIM_URL: ${{ vars.VITE_LICENSE_CLAIM_URL }}
          VITE_SYNC_API_URL: ${{ vars.VITE_SYNC_API_URL }}
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5