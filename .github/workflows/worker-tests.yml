name: Worker tests

# Chạy test Worker (runtime Workers thật qua Miniflare) mỗi khi mã Worker thay đổi. Không deploy.
on:
  push:
    branches: [main]
    paths: ['cloudflare-worker/**', '.github/workflows/worker-tests.yml']
  pull_request:
    paths: ['cloudflare-worker/**', '.github/workflows/worker-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: cloudflare-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Worker tests
        run: npm test
