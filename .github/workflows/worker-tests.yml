name: Worker tests

# Chạy test Worker (runtime Workers thật qua Miniflare) mỗi khi mã Worker thay đổi. Không deploy.
on:
  push:
    branches: [main]
    paths: ['cloudflare-worker/**', '.github/workflows/worker-tests.yml']
  pull_request:
    paths: ['cloudflare-worker/**', '.github/workflows/worker-tests.yml']
  workflow_dispatch:

# Mặc định không cấp quyền nào; job test chỉ cần đọc mã (B10).
# Action ghim theo SHA commit đầy đủ, chú thích là tag tương ứng; Dependabot nâng cả hai.
permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: cloudflare-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Worker tests
        run: npm test
